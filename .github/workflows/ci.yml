name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # The auto_settings submodule isn't needed: the broker tests mock its provider
      - uses: actions/checkout@v4

      - name: Install Lua 5.1
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.1

      - name: Lua plugin tests
        working-directory: lightroom-plugin.lrplugin/tests
        run: lua5.1 RunTests.lua

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: mcp-server/requirements.txt

      - name: Install Python dependencies
        run: pip install -r mcp-server/requirements.txt

      - name: Python tests
        working-directory: mcp-server
        run: python -m unittest discover -s tests
